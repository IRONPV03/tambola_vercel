<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Host</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header class="header">
        <h1>🎲 Tambola Host</h1>
        <p>Create a room and start your game.</p>
    </header>

    <section class="card">

        <button id="createGame" class="primary-btn">
            Create New Game
        </button>

        <div class="row">

            <div class="field">
                <label>Game ID</label>

                <div id="gameId" class="value">
                    -
                </div>

            </div>

            <div class="field">

                <label>Remaining</label>

                <div id="remainingCount" class="value">
                    90
                </div>

            </div>

            <div class="field">

                <label>Drawn</label>

                <div id="drawnCount" class="value">
                    0
                </div>

            </div>

        </div>

        <div class="share">

            <input
                    id="shareLink"
                    readonly
                    placeholder="Create a game first">

            <button id="copyLink">
                Copy Link
            </button>

        </div>

    </section>



    <section class="current-number">

        <div id="currentNumber">

            --

        </div>

        <div id="currentCall">

            Waiting...

        </div>

    </section>



    <section class="controls">

        <button
                id="drawBtn"
                class="draw-btn">

            🎲 Draw Number

        </button>

        <button
                id="resetBtn"
                class="reset-btn">

            🔄 Reset

        </button>

    </section>



    <section class="card">

        <h2>

            Recent Numbers

        </h2>

        <div
                id="history"
                class="history">

        </div>

    </section>



    <section class="card">

        <h2>

            Tambola Board

        </h2>

        <div
                id="board"
                class="board">

        </div>

    </section>

</div>



<div
        id="toast"
        class="toast">

</div>



<script>

const board=document.getElementById("board");

for(let i=1;i<=90;i++){

    const cell=document.createElement("div");

    cell.className="cell";

    cell.id="cell-"+i;

    cell.innerText=i;

    board.appendChild(cell);

}

</script>

<script src="{{ url_for('static', filename='host.js') }}"></script>

</body>
</html>
